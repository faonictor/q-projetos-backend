# Configuracoes do Banco de Dados MySQL - PRODUCAO (Aiven)
# Utilize variaveis de ambiente para as credenciais
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes do Hibernate/JPA - PRODUCAO
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuracao da Porta do Servidor
server.port=${PORT:8080}

# Configuração do Login Social com Google (OAuth2)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Configuração do JWT
jwt.secret=${JWT_SECRET}
